include:
  - project: "vflirt/platform/ci-templates"
    file:
      - "build/docker-build.yml"
      - "deploy/docker-deploy.yml"

# ветки dev/staging/stage/release* (тег: branch-commitsha-pipelineid)
# build_branch for every service, deploy/rollback for all services in parallel
build_branch_ai:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_branch_api:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_branch_migrator:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_branch_web:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_branch_worker:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"


deploy_staging_ai:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_branch_ai"]
deploy_staging_api:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["build_branch_api"]
deploy_staging_migrator:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_branch_migrator"]
deploy_staging_web:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["build_branch_web"]
deploy_staging_worker:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_branch_worker"]

rollback_staging_ai:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_staging_ai"]
  when: manual
  allow_failure: true
rollback_staging_api:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_staging_api"]
  when: manual
  allow_failure: true

rollback_staging_migrator:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_staging_migrator"]
  when: manual
  allow_failure: true
rollback_staging_web:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_staging_web"]
  when: manual
  allow_failure: true
rollback_staging_worker:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_staging_worker"]
  when: manual
  allow_failure: true

# тэги (tag: tagname)
# build_tag for every service, deploy/rollout/rollback for all services in parallel
build_tag_ai:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_tag_api:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_tag_migrator:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_tag_web:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_tag_worker:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"

deploy_prod_ai:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_tag_ai"]
deploy_prod_api:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "api"
  needs: ["build_tag_api"]
deploy_prod_migrator:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_tag_migrator"]
deploy_prod_web:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "web"
  needs: ["build_tag_web"]
deploy_prod_worker:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_tag_worker"]

rollback_prod_ai:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_prod_ai"]
  when: manual
  allow_failure: true
rollback_prod_api:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_prod_api"]
  when: manual
  allow_failure: true
rollback_prod_migrator:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_prod_migrator"]
  when: manual
  allow_failure: true
rollback_prod_web:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_prod_web"]
  when: manual
  allow_failure: true
rollback_prod_worker:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_prod_worker"]
  when: manual
  allow_failure: true
