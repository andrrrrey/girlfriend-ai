include:
  - project: "vflirt/platform/ci-templates"
    file:
      - "build/docker-build.yml"
      - "deploy/docker-deploy.yml"

# ветки dev/staging/stage/release* (тег: branch-commitsha-pipelineid)
# build_branch for every service, deploy/rollback for all services in parallel
build_branch_ai:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_branch_api:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_branch_migrator:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_branch_web:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_branch_worker:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"


deploy_staging_ai:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_branch_ai"]
deploy_staging_api:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["build_branch_api"]
deploy_staging_migrator:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_branch_migrator"]
deploy_staging_web:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["build_branch_web"]
deploy_staging_worker:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_branch_worker"]

rollback_staging_ai:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_staging_ai"]
  when: manual
  allow_failure: true
rollback_staging_api:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_staging_api"]
  when: manual
  allow_failure: true

rollback_staging_migrator:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_staging_migrator"]
  when: manual
  allow_failure: true
rollback_staging_web:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_staging_web"]
  when: manual
  allow_failure: true
rollback_staging_worker:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_staging_worker"]
  when: manual
  allow_failure: true

# тэги (tag: tagname)
# build_tag for every service, deploy/rollout/rollback for all services in parallel
build_tag_ai:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_tag_api:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_tag_migrator:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_tag_web:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_tag_worker:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"

deploy_prod_ai:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_tag_ai"]
deploy_prod_api:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "api"
  needs: ["build_tag_api"]
deploy_prod_migrator:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_tag_migrator"]
deploy_prod_web:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "web"
  needs: ["build_tag_web"]
deploy_prod_worker:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_tag_worker"]

rollback_prod_ai:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_prod_ai"]
  when: manual
  allow_failure: true
rollback_prod_api:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_prod_api"]
  when: manual
  allow_failure: true
rollback_prod_migrator:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_prod_migrator"]
  when: manual
  allow_failure: true
rollback_prod_web:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_prod_web"]
  when: manual
  allow_failure: true
rollback_prod_worker:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_prod_worker"]
  when: manual
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# Диагностика: вывести логи контейнера migrator прямо в GitLab.
# deploy_staging_migrator делает `docker compose up -d migrator` и не показывает
# stdout контейнера, поэтому вывод `prisma migrate deploy` и `import_articles_*`
# не виден. Наследуем .deploy_staging (та же docker-связь, что у рабочего
# деплоя — иначе docker:cli ломится в несуществующий tcp://docker:2375) и лишь
# подменяем script: печатаем статус и `docker logs` последнего migrator-контейнера.
# Запускать после deploy_staging_migrator. Ничего не деплоит, только читает логи.
migrator_logs_staging:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "migrator"
  when: manual
  needs: []
  allow_failure: true
  script:
    - |
      set +e
      echo "=== connection-related env var NAMES (значения не печатаем) ==="
      env | cut -d= -f1 | grep -iE 'host|user|remote|ssh|deploy|stage|dir|target|server' | grep -viE 'known_hosts|private_key|password|secret|token' | sort
      HOST="${DEPLOY_HOST:-${REMOTE_HOST:-${SSH_HOST:-${STAGE_HOST:-${DEPLOY_SERVER:-${REMOTE_SERVER:-}}}}}}"
      SSHUSER="${DEPLOY_USER:-${REMOTE_USER:-${SSH_USER:-${STAGE_USER:-}}}}"
      DIR="${REMOTE_APP_DIR:-.}"
      echo "detected HOST='${HOST}' USER='${SSHUSER}' DIR='${DIR}'"
      if [ -z "$HOST" ]; then echo "!! не удалось определить хост деплоя — посмотри имена переменных выше и скинь мне"; exit 0; fi
      TARGET="${SSHUSER:+${SSHUSER}@}${HOST}"
      echo "=== ssh ${TARGET} : migrator status + logs ==="
      ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$TARGET" "cd '$DIR' 2>/dev/null; echo '--- migrator container(s) ---'; (docker compose ps -a migrator 2>/dev/null || docker ps -a --filter name=migrator); echo '--- migrator logs (tail 400) ---'; (docker compose logs --no-color --tail=400 migrator 2>/dev/null || docker logs \$(docker ps -a --filter name=migrator --format '{{.Names}}' | head -1) 2>&1 | tail -400)"
      echo "=== ssh exit: $? ==="
