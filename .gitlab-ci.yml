  image: alpine:3.19
  stage: deploy
  when: manual
  allow_failure: true
  only:
    - tags
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_KEY" | base64 -d > ~/.ssh/prod_key
    - chmod 600 ~/.ssh/prod_key
    - ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/prod_key "$PRODUCTION_USER@$PRODUCTION_HOST" "
        docker exec psql psql -U postgres -d app -c \"UPDATE \\\"User\\\" SET role='admin' WHERE email='${ADMIN_EMAIL}'\"
      "
rollback_prod_migrator:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_prod_migrator"]
  when: manual
  allow_failure: true
rollback_prod_web:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_prod_web"]
  when: manual
  allow_failure: true
rollback_prod_worker:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_prod_worker"]
  when: manual
  allow_failure: true
