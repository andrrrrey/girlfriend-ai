include:
  - project: "vflirt/platform/ci-templates"
    file:
      - "build/docker-build.yml"
      - "deploy/docker-deploy.yml"

# ветки dev/staging/stage/release* (тег: branch-commitsha-pipelineid)
# build_branch for every service, deploy/rollback for all services in parallel
build_branch_ai:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_branch_api:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_branch_migrator:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_branch_web:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_branch_worker:
  extends: .build_image_branch
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"


deploy_staging_ai:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_branch_ai"]
deploy_staging_api:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["build_branch_api"]
deploy_staging_migrator:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_branch_migrator"]
deploy_staging_web:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["build_branch_web"]
deploy_staging_worker:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_branch_worker"]

rollback_staging_ai:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_staging_ai"]
  when: manual
  allow_failure: true
rollback_staging_api:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_staging_api"]
  when: manual
  allow_failure: true

rollback_staging_migrator:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_staging_migrator"]
  when: manual
  allow_failure: true
rollback_staging_web:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_staging_web"]
  when: manual
  allow_failure: true
rollback_staging_worker:
  extends: .rollback_staging
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_staging_worker"]
  when: manual
  allow_failure: true

# тэги (tag: tagname)
# build_tag for every service, deploy/rollout/rollback for all services in parallel
build_tag_ai:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "ai"
    DOCKERFILE_PATH: "infra/docker/ai.Dockerfile"
build_tag_api:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "api"
    DOCKERFILE_PATH: "infra/docker/api.Dockerfile"
build_tag_migrator:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "migrator"
    DOCKERFILE_PATH: "infra/docker/migrator.Dockerfile"
build_tag_web:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "web"
    DOCKERFILE_PATH: "infra/docker/web.Dockerfile"
build_tag_worker:
  extends: .build_image_tag
  variables:
    SERVICE_NAME: "worker"
    DOCKERFILE_PATH: "infra/docker/worker.Dockerfile"

deploy_prod_ai:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["build_tag_ai"]
deploy_prod_api:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "api"
  needs: ["build_tag_api"]
deploy_prod_migrator:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["build_tag_migrator"]
deploy_prod_web:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "web"
  needs: ["build_tag_web"]
deploy_prod_worker:
  extends: .deploy_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["build_tag_worker"]

rollback_prod_ai:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "ai"
  needs: ["deploy_prod_ai"]
  when: manual
  allow_failure: true
rollback_prod_api:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "api"
  needs: ["deploy_prod_api"]
  when: manual
  allow_failure: true
rollback_prod_migrator:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "migrator"
  needs: ["deploy_prod_migrator"]
  when: manual
  allow_failure: true
rollback_prod_web:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "web"
  needs: ["deploy_prod_web"]
  when: manual
  allow_failure: true
rollback_prod_worker:
  extends: .rollback_production
  variables:
    SERVICE_NAME: "worker"
  needs: ["deploy_prod_worker"]
  when: manual
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# Диагностика: вывести логи контейнера migrator прямо в GitLab.
# deploy_staging_migrator делает `docker compose up -d migrator` и не показывает
# stdout контейнера, поэтому вывод `prisma migrate deploy` и `import_articles_*`
# не виден. Наследуем .deploy_staging (та же docker-связь, что у рабочего
# деплоя — иначе docker:cli ломится в несуществующий tcp://docker:2375) и лишь
# подменяем script: печатаем статус и `docker logs` последнего migrator-контейнера.
# Запускать после deploy_staging_migrator. Ничего не деплоит, только читает логи.
migrator_logs_staging:
  extends: .deploy_staging
  variables:
    SERVICE_NAME: "migrator"
  when: manual
  needs: []
  allow_failure: true
  script:
    - |
      set +e
      HOST="${DEPLOY_HOST:-${STAGING_HOST:-}}"
      SSHUSER="${DEPLOY_USER:-${STAGING_USER:-deploy}}"
      DIR="${REMOTE_APP_DIR:-.}"
      echo "target: ${SSHUSER}@${HOST}  dir: ${DIR}"
      if [ -z "$HOST" ]; then echo "!! DEPLOY_HOST не задан"; exit 0; fi
      echo "=== ssh ${SSHUSER}@${HOST} : migrator status + logs (через sudo docker) ==="
      ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "${SSHUSER}@${HOST}" "cd '$DIR' 2>/dev/null; echo '--- migrator container(s) ---'; (sudo docker compose ps -a migrator 2>/dev/null || sudo docker ps -a --filter name=migrator); echo '--- migrator logs (tail 400) ---'; NAME=\$(sudo docker ps -a --filter name=migrator --format '{{.Names}}' | head -1); if [ -n \"\$NAME\" ]; then sudo docker logs \"\$NAME\" 2>&1 | tail -400; else echo 'no migrator container'; fi"
      echo "=== ssh exit: $? ==="

# ─────────────────────────────────────────────────────────────────────────────
# Диагностика ПРОДА без доступа к серверу: логи контейнеров и проверка env.
# Ручной job, ничего не деплоит и не меняет — только читает через тот же SSH,
# что и deploy_prod_*. Для каждого сервиса печатает:
#   - статус контейнера и подключённые env_file из docker-compose.yml;
#   - ключевые переменные (ENV, API_HOST/PORT, AI_HOST/PORT) и задан ли
#     INTERNAL_API_TOKEN — БЕЗ значения: длина и первые 12 символов sha256,
#     чтобы сравнить, совпадает ли токен у api/ai/worker;
#   - хвост логов контейнера.
# Параметры (можно задать при запуске job в GitLab: «Run job» → Variables):
#   LOG_SERVICES — сервисы через пробел (по умолчанию "ai api worker")
#   LOG_TAIL     — сколько последних строк лога (по умолчанию 300)
#   LOG_GREP     — фильтр строк лога, regex (напр. "ERR|error|401")
# Запуск: пайплайн по тегу (там доступны ключи прода) → ▶ prod_logs.
prod_logs:
  extends: .deploy_production
  stage: deploy
  needs: []
  allow_failure: true
  variables:
    LOG_SERVICES: "ai api worker"
    LOG_TAIL: "300"
    LOG_GREP: ""
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
    - when: never
  script:
    - |
      set +e
      HOST="${DEPLOY_HOST:-${PRODUCTION_HOST:-}}"
      SSHUSER="${DEPLOY_USER:-${PRODUCTION_USER:-deploy}}"
      BASE="${REMOTE_APP_DIR:-/opt/docker/apps/$CI_PROJECT_PATH}"
      echo "target: ${SSHUSER}@${HOST}  base dir: ${BASE}"
      echo "services: ${LOG_SERVICES}  tail: ${LOG_TAIL}  grep: '${LOG_GREP}'"
      if [ -z "$HOST" ]; then echo "!! PRODUCTION_HOST недоступен (job запущен не из пайплайна по тегу / переменные protected?)"; exit 1; fi
      ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "${SSHUSER}@${HOST}" \
        bash -s -- "$BASE" "$LOG_SERVICES" "$LOG_TAIL" "$LOG_GREP" <<'REMOTE'
      set +e
      BASE="$1"; SERVICES="$2"; TAIL="$3"; GREP="$4"
      for S in $SERVICES; do
        echo
        echo "==================== $S ===================="
        DIR="$BASE/$S"
        C=""
        if [ -d "$DIR" ]; then
          cd "$DIR"
          echo "--- env_file в $DIR/docker-compose.yml ---"
          awk '/env_file/{f=1;print;next} f&&/^[[:space:]]*-/{print;next} {f=0}' docker-compose.yml 2>/dev/null || echo "(нет docker-compose.yml)"
          echo "--- контейнер ---"
          sudo docker compose ps -a "$S" 2>/dev/null
          C=$(sudo docker compose ps -q "$S" 2>/dev/null | head -1)
        else
          echo "!! нет каталога $DIR — ищу контейнер по имени"
        fi
        [ -z "$C" ] && C=$(sudo docker ps -a --filter "name=$S" --format '{{.ID}}' | head -1)
        if [ -z "$C" ]; then echo "!! контейнер $S не найден"; continue; fi
        echo "--- env (без секретов) ---"
        ENVS=$(sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$C")
        printf '%s\n' "$ENVS" | grep -E '^(ENV|API_HOST|API_PORT|AI_HOST|AI_PORT|LOG_LEVEL)=' 
        TOK=$(printf '%s\n' "$ENVS" | grep -E '^INTERNAL_API_TOKEN=' | head -1 | cut -d= -f2-)
        if printf '%s\n' "$ENVS" | grep -qE '^INTERNAL_API_TOKEN='; then
          if [ -n "$TOK" ]; then
            echo "INTERNAL_API_TOKEN: задан (длина ${#TOK}, sha256 $(printf '%s' "$TOK" | sha256sum | cut -c1-12))"
          else
            echo "INTERNAL_API_TOKEN: ПУСТОЙ"
          fi
        else
          echo "INTERNAL_API_TOKEN: НЕ ЗАДАН в контейнере"
        fi
        echo "--- логи (последние $TAIL строк${GREP:+, фильтр /$GREP/}) ---"
        if [ -n "$GREP" ]; then
          sudo docker logs --tail "$TAIL" "$C" 2>&1 | grep -E -- "$GREP" | cut -c1-3000
        else
          sudo docker logs --tail "$TAIL" "$C" 2>&1 | cut -c1-3000
        fi
      done
      REMOTE
      echo "=== ssh exit: $? ==="
