volumes:
  node_modules:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9001:9001"

  # One-time setup: install deps, build shared packages, generate Prisma client
  setup:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        pnpm install &&
        pnpm -r --filter './packages/*' build &&
        pnpm --filter migrator build &&
        cd apps/api && npx prisma generate
      "

  migrator:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    env_file: ../../env.example
    command: ["node", "apps/migrator/dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    env_file: ../../env.example
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "8080:8080"
    command: ["pnpm", "--filter", "api", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  ai:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    env_file: ../../env.example
    ports:
      - "8081:8081"
    command: ["pnpm", "--filter", "ai", "dev"]
    depends_on:
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    env_file: ../../env.example
    command: ["pnpm", "--filter", "worker", "dev"]
    depends_on:
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    env_file: ../../env.example
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - API_INTERNAL_URL=http://api:8080
    ports:
      - "3000:3000"
    command: ["pnpm", "--filter", "web", "dev"]
    depends_on:
      api:
        condition: service_started
      setup:
        condition: service_completed_successfully
